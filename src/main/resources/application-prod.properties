# Production Profile
spring.application.name=buyease-api
server.port=8080

# Database Configuration (requires external database setup)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/buyease}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.******
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging
logging.level.root=WARN
logging.level.com.buyease=INFO

# Server Configuration
server.compression.enabled=true
server.compression.min-response-size=1024
server.servlet.context-path=/api

# JPA Connection Pooling
spring.jpa.properties.hibernate.c3p0.min_size=5
spring.jpa.properties.hibernate.c3p0.max_size=20
